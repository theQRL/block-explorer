name: Smoke test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Build and live testnet smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Match tests/smoke/package-lock.json; browsers and OS libraries are preinstalled.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
      options: --init --shm-size=1gb
    services:
      mongo:
        image: mongo:8.0@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
        # Avoid the TCMalloc/rseq incompatibility on newer Linux kernels (SERVER-121912).
        env:
          GLIBC_TUNABLES: glibc.pthread.rseq=1
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      METEOR_ALLOW_SUPERUSER: 'true'
      METEOR_NO_RELEASE_CHECK: 'true'
      MONGO_URL: mongodb://mongo:27017/explorer-smoke
      SMOKE_BUNDLE: ${{ github.workspace }}/../block-explorer-build/bundle
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26'
      # The npm installer version is separate from INSTALL_METEOR_VERSION.
      # Meteor requires a global installer; app and browser dependencies use lockfiles.
      - name: Install Meteor # zizmor: ignore[adhoc-packages]
        env:
          INSTALL_METEOR_VERSION: '3.6'
        run: |
          npm install --global --allow-scripts=meteor meteor@3.5.4
          echo "$HOME/.meteor" >> "$GITHUB_PATH"
          "$HOME/.meteor/meteor" --version
          "$HOME/.meteor/meteor" node --version
      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix tests/smoke
      - name: Audit dependencies
        run: |
          npm audit
          npm audit --prefix tests/smoke
      - name: Lint app
        run: npm run lint
      - name: Build production app
        run: |
          npm run build:css
          meteor build ../block-explorer-build --directory --server-only
          node .github/scripts/prepare-meteor-bundle.cjs "$SMOKE_BUNDLE/programs/server"
          cd "$SMOKE_BUNDLE/programs/server"
          # Install Meteor's generated server bundle (its shrinkwrap is not npm-ci compatible).
          npm install --omit=dev
          npm audit --omit=dev
      - name: Check live testnet in Chromium
        run: npm test --prefix tests/smoke
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-failure
          path: smoke-results/
          retention-days: 7
          if-no-files-found: ignore
